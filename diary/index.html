<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Claude's diary</title>
  <style>
    :root { --ink: #3A2A20; --soft: #8A7566; --accent: #D97757; --paper: #FBF4E6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { font: 15px/1.45 "Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive; color: var(--ink); }
    #page {
      position: relative; margin: 8px; padding: 16px 20px 14px 34px;
      background:
        linear-gradient(to right, transparent 23px, rgba(217, 119, 87, 0.45) 23px, rgba(217, 119, 87, 0.45) 24.5px, transparent 24.5px),
        repeating-linear-gradient(to bottom, transparent 0 25px, rgba(90, 130, 170, 0.16) 25px 26px),
        var(--paper);
      border-radius: 5px 12px 9px 14px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45), 0 0 0 1.5px rgba(58, 42, 32, 0.55);
      transform: rotate(-0.6deg);
    }
    header { display: flex; align-items: baseline; gap: 8px; -webkit-app-region: drag; }
    h1 { font-size: 21px; margin: 0; flex: 1; font-weight: 700; }
    #date { color: var(--soft); font-size: 13px; }
    #close { -webkit-app-region: no-drag; border: 0; background: none; font: inherit; font-size: 20px; color: var(--soft); cursor: pointer; line-height: 1; padding: 0 2px; }
    #close:hover { color: var(--accent); }
    #mood { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
    #mood svg { width: 46px; height: 46px; flex: none; }
    #mood p { margin: 0; }
    h2 { font-size: 14px; margin: 10px 0 2px; color: var(--accent); font-weight: 700; letter-spacing: 0.3px; }
    ul { margin: 0; padding: 0 0 0 16px; }
    li { margin: 0; }
    li::marker { content: "✎  "; color: var(--accent); font-size: 12px; }
    .none { color: var(--soft); }
    #stickers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .sticker {
      min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
      font: 700 12px "Segoe UI", -apple-system, system-ui, sans-serif; color: #fff; box-shadow: 0 0 0 2px #fff, 0 1px 3px 2px rgba(0, 0, 0, 0.25);
    }
    #forms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 8px; margin-top: 3px; font-size: 13.5px; }
    .form.locked { color: var(--soft); }
    .form small { display: block; font-size: 11px; color: var(--soft); line-height: 1.15; }
    footer { margin-top: 9px; color: var(--soft); font-size: 12.5px; border-top: 1.5px dashed rgba(58, 42, 32, 0.3); padding-top: 5px; }
  </style>
</head>
<body>
  <div id="page">
    <header><h1>Claude’s diary</h1><span id="date"></span><button id="close" aria-label="Close" title="Close (Esc)">×</button></header>
    <div id="mood"><svg viewBox="-50 -50 100 100" aria-hidden="true" id="doodle"></svg><p id="mood-text"></p></div>
    <h2>Today I…</h2>
    <ul id="today"></ul>
    <h2>Stickers from places I’ve been</h2>
    <div id="stickers"></div>
    <h2>Shapes I can be</h2>
    <div id="forms"></div>
    <footer id="totals"></footer>
  </div>
  <script src="../renderer/core.js"></script>
  <script src="diary.js"></script>
</body>
</html>
